<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinschool Trung học</title>
<meta name="description" content="Trung học Vinschool – chương trình giáo dục, 6 điểm nổi bật, một ngày học tập và trải nghiệm học tập.">


<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.th{font-family:'Montserrat',system-ui,sans-serif;font-weight:500;color:#051F5E;background:#FFFFFF;font-size:16px;line-height:1.7}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.th a{color:inherit}
.th h1,.th h2,.th h3{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.disp{font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1.22;color:#011A6E}
.gold{color:#AE7929}
.on-navy .gold,.gold-on-navy{color:#D0943A}
.label{display:inline-block;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#051F5E}
.label:after{content:"";display:block;width:36px;height:2px;background:#D0943A;margin-top:10px}
.on-navy .label{color:#FFFFFF}
.just{text-align:justify;hyphens:auto}
.th b{font-weight:700}
.cap{font-weight:300;font-style:italic;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;background:#051F5E;color:#FFFFFF!important;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;white-space:nowrap;transition:transform .25s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(5,31,94,.18)}
.btn.inv{background:#FFFFFF;color:#051F5E!important}
.link{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#051F5E}
.link svg{color:#D0943A;transition:transform .25s ease}
.link:hover svg{transform:translateX(4px)}
.ann{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;align-items:center;background:#111;color:#fff;font:600 12px/1.6 system-ui,sans-serif;padding:6px 12px}
.ann a{color:#fff;text-decoration:underline;text-underline-offset:2px}
.ann .on{background:#fff;color:#111;padding:0 6px;border-radius:4px}
/* ticker */
.ticker{position:relative;background:#051F5E;color:#FFFFFF;font-size:13px;display:flex;align-items:center;overflow:hidden;padding-right:48px}
.ticker .track{display:flex;gap:56px;white-space:nowrap;padding:9px 0;animation:marquee 38s linear infinite;flex:none}
.ticker.paused .track{animation-play-state:paused}
.ticker:hover .track{animation-play-state:paused}
.ticker a{text-decoration:none;opacity:.92}
.ticker a:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#D0943A;margin-right:12px;vertical-align:middle}
.tk-btn{position:absolute;right:0;top:0;bottom:0;background:#051F5E;border:0;color:#FFFFFF;width:44px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;z-index:2;box-shadow:-16px 0 16px #051F5E}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* header */
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(5,31,94,.08)}
.hdr .wrap{display:flex;align-items:center;gap:22px;min-height:78px}
.logo{width:76px;height:56px;flex:none}
.logo img{object-fit:contain}
.links{display:flex;gap:18px;flex:1;font-size:13.5px;font-weight:600;white-space:nowrap}
.links a{text-decoration:none;position:relative;padding:6px 0}
.links a:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:#D0943A;transition:width .3s ease}
.links a:hover:after{width:100%}
.lang{font-weight:700;font-size:14px;white-space:nowrap}
.lang span{color:#AE7929}
.ibtn{width:44px;height:44px;border-radius:999px;border:1px solid rgba(5,31,94,.16);background:#FFFFFF;color:#051F5E;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s ease,color .2s ease}
.ibtn:hover{background:#051F5E;color:#FFFFFF}
.menubtn{display:none}
.mnav{display:none}
/* hero */
.hero{position:relative;min-height:580px;display:flex;align-items:center;overflow:hidden}
.hero .bg{position:absolute;inset:0 0 0 30%;overflow:hidden}
.hero .bg img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:62% center;transform-origin:center 40%;animation:kenburns 18s ease-out both}
.hero .fade{position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,#fff 32%,rgba(255,255,255,.86) 44%,rgba(255,255,255,0) 66%)}
.hero .wrap{position:relative;width:100%}
.hero-copy{max-width:560px}
@keyframes kenburns{from{transform:scale(1.08)}to{transform:scale(1)}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.22s}.d3{animation-delay:.34s}.d4{animation-delay:.46s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
/* sections */
.sec{padding:112px 0}
.kem{background:linear-gradient(180deg,#F0E9D9 0%,#FAF8F4 100%)}
.h2{font-size:48px}
.grid{display:grid;gap:32px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gfwrap{display:grid;grid-template-columns:400px minmax(0,1fr);gap:64px;align-items:start}
.nowrap1{white-space:nowrap}
@media (max-width:860px){.nowrap1{white-space:normal}.pbtn .t{white-space:normal;font-size:15px}}
.gfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 48px}
.gfnum{display:flex;flex-direction:column;justify-content:flex-end;height:142px;font-size:88px;font-weight:700;line-height:1;letter-spacing:-.03em;color:#AE7929;margin:0 0 16px;padding-bottom:16px;border-bottom:1px solid rgba(208,148,58,.45)}
.gfsup{display:block;font-size:25px;font-weight:600;letter-spacing:.01em;line-height:1.2;margin:0 0 8px;color:#051F5E}
.gfunit{font-size:20px;font-weight:600;letter-spacing:0;margin-left:8px;color:#051F5E}
.gfnum.gfword{height:142px;font-size:40px;line-height:1.05;letter-spacing:-.01em}
.gf p{margin:0;font-size:16px;line-height:1.45;max-width:320px}
.gflink{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#051F5E;text-decoration:none}
.gflink svg{color:#D0943A;transition:transform .25s ease}
.gflink:hover svg{transform:translateX(4px)}
.lmgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;max-width:none;margin:0;padding:0;border-top:1px solid rgba(5,31,94,.12);border-bottom:1px solid rgba(5,31,94,.12)}
.lm{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;padding:48px 0;overflow:hidden;text-decoration:none;color:#051F5E!important;background:#FFFFFF;border:0;border-radius:0;box-shadow:none;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s ease,border-color .35s ease}
.lm+.lm{border-left:1px solid rgba(5,31,94,.12)}
.lm:hover{z-index:1;background:#FAF8F4;box-shadow:0 20px 48px rgba(5,31,94,.14)}
.lm h3{color:#011A6E}
.lmic{display:block;margin:0 auto 28px;color:#AE7929;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.lm:hover .lmic{transform:translateY(-6px)}
.lmtx{position:relative;text-align:center;padding:0 40px;max-width:480px}
.lm h3{font-size:clamp(22px,2.2vw,30px);font-weight:700;line-height:1.2;margin:0 0 20px;white-space:nowrap}
.lm p{margin:0;font-size:16px;line-height:1.7}
.ctab{background:#051F5E;color:#FFFFFF}
.ctawrap{display:grid;grid-template-columns:minmax(0,1.2fr) auto;gap:48px;align-items:center;padding-top:64px;padding-bottom:64px}
.ctaeb{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#D0943A;margin-bottom:8px}
.ctah{font-size:34px;white-space:nowrap;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1.15;margin:0 0 12px;color:#FFFFFF}
.ctap{margin:0;font-size:16px;line-height:1.6;opacity:.92}
.ctabtns{display:flex;gap:12px;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.04em;text-decoration:none;color:#FFFFFF!important;box-shadow:inset 0 0 0 2px #FFFFFF;transition:background .25s ease,color .25s ease,transform .25s ease}
.cbtn:hover{background:#FFFFFF;color:#051F5E!important;transform:translateY(-2px)}
.cbtn.solid{background:#FFFFFF;color:#051F5E!important}
.cbtn.solid:hover{background:#D0943A;box-shadow:inset 0 0 0 2px #D0943A}
/* stats band */
.band{background:#051F5E;color:#FFFFFF}
.stat{display:flex;gap:16px;align-items:flex-start;padding:4px 28px;border-left:1px solid rgba(208,148,58,.55)}
.stat:first-child{border-left:0;padding-left:0}
.stat .ico{color:#D0943A;flex:none;margin-top:6px}
.stat small{display:block;font-size:13px;font-weight:600;opacity:.85}
.stat strong{display:block;font-size:44px;font-weight:700;line-height:1.05;color:#D0943A}
.stat p{margin:6px 0 0;font-size:14px;line-height:1.5}
.scard{display:flex;align-items:center;gap:28px;background:#FAF8F4;border-radius:24px;padding:28px 36px;color:#051F5E;box-shadow:0 1px 2px rgba(5,31,94,.06)}
.scard .ico{color:#D0943A}
.scard .rule{width:1px;align-self:stretch;background:#D0943A;opacity:.6}
/* pillars */
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-between;height:100%}
.pbtn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;width:100%;padding:12px 20px;border-radius:16px;position:relative;transition:background .3s ease}
.pbtn .n{font-size:46px;font-weight:700;line-height:1;color:#AE7929;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.pbtn .t{font-weight:700;font-size:17px;white-space:nowrap;text-transform:uppercase;letter-spacing:.01em;line-height:1.35;color:rgba(5,31,94,.74);transition:color .3s ease}
.pbtn:hover{background:#FAF8F4}
.pbtn .phl{color:#AE7929}
.pbtn.on .phl{color:#D0943A}
.pbtn.on{background:linear-gradient(135deg,#FBF5E8 0%,#EFE0C0 100%)}
.pbtn.on .t{color:#011A6E!important}
.pbtn.on .phl{color:#AE7929!important}
.pbtn.on .n{color:#AE7929!important}
.pbtn.on .t{color:#FFFFFF}
.pbtn.on .n{color:#D0943A;transform:scale(1.08)}
.pcard{position:relative;border-radius:24px;overflow:hidden;background:#F3EEE1;min-height:0;display:flex;flex-direction:column}
.pcard .ph{height:440px;position:relative}
.pcard .ph img{object-position:center 22%}
.pcard .ph:after{content:"";position:absolute;inset:auto 0 -1px 0;height:96px;background:linear-gradient(180deg,rgba(243,238,225,0) 0%,rgba(243,238,225,.06) 20%,rgba(243,238,225,.22) 40%,rgba(243,238,225,.5) 62%,rgba(243,238,225,.82) 82%,#F3EEE1 100%)}
.pcard .tx{padding:20px 40px 36px;position:relative}
.swap{animation:swap .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* day */
.rail{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:40px 0 32px}
.rail:before{content:"";position:absolute;left:10%;right:10%;top:27px;height:2px;background:rgba(5,31,94,.14)}
.rail .fill{position:absolute;left:10%;top:27px;height:2px;background:#D0943A;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.node{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;position:relative;padding:0 8px}
.node .dot{width:56px;height:56px;border-radius:50%;background:#FFFFFF;border:2px solid rgba(5,31,94,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;transition:all .35s ease}
.node.on .dot{background:#051F5E;border-color:#051F5E;color:#D0943A;transform:scale(1.12);box-shadow:0 0 0 8px rgba(208,148,58,.18)}
.node .tm{font-weight:700;font-size:14px}
.node .dot{color:#051F5E}
.node .dot svg{display:block}
.node.on .dot{color:#D0943A}
.node .nm{font-size:13px;font-weight:600;color:rgba(5,31,94,.74);line-height:1.4;max-width:180px}
.node.on .nm{color:#051F5E}
.dhead{display:flex;align-items:center;gap:20px;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid rgba(208,148,58,.45)}
.dtime{font-size:28px;font-weight:700;color:#AE7929;white-space:nowrap;line-height:1}
.dname{font-size:20px;font-weight:800;text-transform:uppercase;line-height:1.2;color:#011A6E;white-space:nowrap;margin:0}
.dcard{display:block;background:#FAF8F4;border-radius:24px;padding:32px 40px;box-shadow:0 1px 2px rgba(5,31,94,.06)}
.dcard p{line-height:1.5}
/* experiences carousel — ảnh lớn, hover hiện chữ */
.viewport{overflow:hidden;margin-top:48px}
.xbleed{margin-right:calc(50% - 50vw);--cw:357px}
.trackx{display:flex;gap:24px;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.xcard{--cw:357px;position:relative;flex:0 0 var(--cw);height:500px;border-radius:24px;overflow:hidden;background:#0b1f4d;isolation:isolate;outline:none}
.xcard img{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.xcard:hover img,.xcard:focus-within img{transform:scale(1.05)}
.xshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,31,94,0) 45%,rgba(5,31,94,.82) 100%);transition:opacity .5s ease}
.xcap{position:absolute;left:20px;right:20px;bottom:24px;color:#FFFFFF;transition:opacity .35s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.xn{display:block;font-weight:700;font-size:14px;letter-spacing:.12em;color:#D0943A;margin-bottom:8px}
.xt{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#FFFFFF}
@media (max-width:860px){.xt{font-size:18px;white-space:normal}}
.xpanel{position:absolute;left:12px;right:12px;bottom:12px;padding:22px 20px 22px;border-radius:18px;background:rgba(255,255,255,.84);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 18px 40px rgba(5,31,94,.18);color:#051F5E;opacity:0;transform:translateY(32px);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.xpanel h3{font-size:16px;font-weight:700;line-height:1.2;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#011A6E;margin:0 0 12px}
.xpanel p{margin:0;font-size:14px;line-height:1.5}
.xn2{font-weight:700;font-size:12px;letter-spacing:.14em;color:#051F5E;opacity:.74}
.xplus{display:inline-flex;align-items:center;justify-content:center;width:84px;height:52px;border-radius:999px;background:#051F5E;color:#FFFFFF!important;transition:background .25s ease,transform .25s ease}
.xplus:hover{background:#011A6E;transform:translateY(-2px)}
.xplus svg{color:#D0943A}
.xcard:hover .xpanel,.xcard:focus-within .xpanel{opacity:1;transform:none;pointer-events:auto}
.xcard:hover .xcap,.xcard:focus-within .xcap{opacity:0;transform:translateY(12px)}
.xcard:hover .xshade,.xcard:focus-within .xshade{opacity:.35}
.xlay{display:grid;grid-template-columns:380px minmax(0,1fr);gap:56px;align-items:stretch}
.xleft{display:flex;flex-direction:column;justify-content:center}
.xcurt{padding:0}
.xno{display:block;font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em;color:#AE7929;margin-bottom:16px}
.xno i{font-style:normal;font-size:20px;color:rgba(5,31,94,.45);letter-spacing:0}
.xcurt h3{font-size:31px;font-weight:800;text-transform:uppercase;line-height:1.2;white-space:pre-line;letter-spacing:-.01em;color:#011A6E;margin:0}
.xnav{display:flex;align-items:center;gap:16px;margin-top:40px}
.xnav .prog{flex:1}
.xlist{list-style:none;margin:0;padding:0;border-top:1px solid rgba(5,31,94,.14)}
.xbtn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;width:100%;padding:15px 16px;border-bottom:1px solid rgba(5,31,94,.14);position:relative;transition:background .3s ease,padding .3s ease}
.xbtn:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#D0943A;transform:scaleY(0);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.xbtn .n{font-weight:700;font-size:14px;letter-spacing:.08em;color:#AE7929}
.xbtn .t{font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.01em;line-height:1.35;color:rgba(5,31,94,.6);transition:color .3s ease}
.xbtn:hover{background:#FAF8F4}.xbtn:hover .t{color:#051F5E}
.xbtn.on{background:#F3EEE1;padding-left:22px}.xbtn.on:before{transform:none}.xbtn.on .t{color:#011A6E}
.xbtn:focus-visible{outline:2px solid #D0943A;outline-offset:-2px}
.xbox{display:flex;flex-direction:column;gap:16px}
.xbox .xph{border-radius:24px;overflow:hidden}
.xbox .xtx{border-radius:24px;background:#F3EEE1}
.xbox .xph{aspect-ratio:3/2;height:auto}
.xbox .xph{position:relative}.xbox .xph img{position:absolute;inset:0;object-position:center center}
.xbox .xtx{padding:28px 36px 30px}
.xbox h3{font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.3;color:#011A6E;margin:0 0 12px}
.xbox p{margin:0;font-size:16px;line-height:1.45}
@media (max-width:860px){.xlay{grid-template-columns:minmax(0,1fr);gap:28px}.xcurt{padding-top:0}.xno{font-size:40px}.xcurt h3{font-size:22px}.xbox .xph{aspect-ratio:3/2;height:auto}.xbox .xtx{padding:22px 22px 26px}}
/* unified experience block */
.xsec{position:relative;overflow:hidden;background:linear-gradient(115deg,#FAF8F4 0%,#F3EEE1 38%,#ECD9B4 100%)}
.xsec:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 0% 60%,rgba(208,148,58,.18) 0%,rgba(208,148,58,0) 70%);pointer-events:none}
.xsec:after{content:"";position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,#FFFFFF 100%);pointer-events:none}
.xsec .wrap{position:relative;z-index:1}
.xlay{position:relative;gap:0!important}
.xleft{position:relative;padding:24px 32px 24px 0}
.xbox{position:relative;gap:0!important}
.xbox .xph{border-radius:0!important;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%),linear-gradient(180deg,#000 62%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0%,#000 22%),linear-gradient(180deg,#000 62%,transparent 100%);mask-composite:intersect}
.xbox .xtx{background:transparent!important;border-radius:0!important;padding:8px 0 0 40px!important;margin-top:0;position:relative}
.xbox p{color:#051F5E}
@media (max-width:860px){.xleft{padding:32px 24px 8px}.xbox .xph{-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}.xbox .xtx{padding:0 24px 32px!important;margin-top:-40px}}
.xctrl{display:flex;align-items:center;gap:20px;margin-top:36px}
.xcount{font-weight:700;font-size:14px;min-width:64px;text-align:right}
.xarrow{width:56px;height:56px;flex:none;border-radius:50%;border:1.5px solid #051F5E;background:transparent;color:#051F5E;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .25s ease,opacity .25s ease,transform .25s ease}
.xarrow:hover:not(:disabled){background:#051F5E;color:#FFFFFF;transform:translateY(-2px)}
.xleft{justify-content:flex-start!important}
.xcurt{margin:auto 0}
.xnav{margin-top:0!important;padding-bottom:4px}
.xarrow:disabled{opacity:.28;cursor:default}
.prog{height:3px;background:rgba(5,31,94,.12);flex:1;position:relative;overflow:hidden;border-radius:3px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#D0943A;transition:width .6s ease}

/* offer */

  .th section.sec.kem{padding:56px 0!important}

/* Mobile: thu gọn đoạn mô tả "Một ngày ở trường", có nút Xem thêm */
.th .dmore{display:none}
@media (max-width:860px){

/* Mobile: chữ trải nghiệm học tập không đè lên ảnh */

}

/* Mobile: không cắt vòng sáng của mốc thời gian đang chọn */
@media (max-width:860px){
  .th .rail{padding:16px 4px 8px!important}

}

@media (max-width:860px){

}

/* Mobile: "Tìm hiểu thêm" dạng thẻ */
@media (max-width:860px){

  .th .lmgrid .lm:after{content:"";position:absolute;right:20px;top:50%;width:9px;height:9px;border-top:2px solid #051F5E;border-right:2px solid #051F5E;transform:translateY(-50%) rotate(45deg)}
  .th .lmgrid .lmtx{display:grid!important;grid-template-columns:48px minmax(0,1fr)!important;column-gap:14px!important;align-items:center!important;padding:0!important;max-width:none!important;width:100%!important;text-align:left!important}
  .th .lmgrid .lmic{grid-row:1 / span 2;align-self:start;width:48px!important;height:48px!important;padding:11px;box-sizing:border-box;border-radius:50%;background:linear-gradient(135deg,#FBF5E8,#EBD9B4);margin:0!important;transform:none!important}
  .th .lmgrid .lm h3{font-size:17px!important;line-height:1.3!important;margin:0 0 4px!important;white-space:normal!important}
  .th .lmgrid .lm p{font-size:13.5px!important;line-height:1.5!important;color:rgba(5,31,94,.78)}
  .th .lmgrid .lm:before{display:none!important}
  .th section .wrap[style*="margin-bottom:40px"]{margin-bottom:22px!important;text-align:left!important}
}

/* Mobile: banner Đăng ký có khoảng thở */

/* Mobile: tên trải nghiệm 1 dòng, tự co chữ theo độ dài */

  .th .xcurt h3{white-space:nowrap!important;font-size:min(20px, calc((100vw - 64px) / var(--xlen, 16) / .74))!important;line-height:1.25!important}
}

/* Mobile: 6 điểm nổi bật dạng thẻ vuốt ngang (ảnh + tiêu đề + nội dung liền nhau) */
.th .pmob{display:none}

  .th #khac-biet .split{display:none!important}
  .th .pmob{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:20px -20px 0;padding:0 20px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:stretch}
  .th .pmob::-webkit-scrollbar{display:none}
  .th .pmc{flex:0 0 84%;scroll-snap-align:start;scroll-margin-left:20px;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:#F3EEE1;box-shadow:0 6px 18px rgba(5,31,94,.06)}
  .th .pmi{position:relative;height:200px;flex:none}
  .th .pmi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
  .th .pmt{padding:16px 18px 22px}
  .th .pmn{display:block;font-size:30px;font-weight:700;line-height:1;color:#AE7929;margin-bottom:8px}
  .th .pmc h3{margin:0 0 10px;font-size:15px;font-weight:700;text-transform:uppercase;line-height:1.35;letter-spacing:.01em}
  .th .pmh1{display:block;color:#AE7929}
  .th .pmh2{display:block;color:#011A6E}
  .th .pmc p{margin:0;font-size:14px;line-height:1.55;color:#051F5E}
}

/* Toàn trang dùng Montserrat */
.th,.th *:not(svg):not(path):not(circle):not(rect):not(line):not(polyline),.th button,.th input,.th textarea,.th select{font-family:'Montserrat',system-ui,sans-serif!important}
</style>

</head>

<div class="mnsoc"><a href="#" aria-label="Facebook"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v8h4v-8h3l.5-4h-3.5V8.8c0-.5.3-.8.5-.8z"></path></svg></a><a href="#" aria-label="Email"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M3 5h18a1 1 0 0 1 1 1v.4l-10 6.2L2 6.4V6a1 1 0 0 1 1-1zm-1 3.7l10 6.2 10-6.2V18a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"></path></svg></a><a href="#" aria-label="YouTube"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M22 8.2a3 3 0 0 0-2.1-2.1C18 5.6 12 5.6 12 5.6s-6 0-7.9.5A3 3 0 0 0 2 8.2 31 31 0 0 0 1.6 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2.1 2.1c1.9.5 7.9.5 7.9.5s6 0 7.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .4-3.8 31 31 0 0 0-.4-3.8zM10 15V9l5.2 3z"></path></svg></a></div>
<a class="mncta" href="#dang-ky" onClick="{{ closeMenu }}">Đăng ký tuyển sinh</a></div>
<div class="mnr"><h3>Xem nhiều nhất<svg width="46" height="30" viewBox="0 0 46 30" fill="none" stroke="#D0943A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22c12 6 26 4 36-14"></path><path d="M30 8l9-1 1 9"></path></svg></h3><nav aria-label="Xem nhiều nhất"><a href="#" onClick="{{ closeMenu }}">Học phí</a><a href="#" onClick="{{ closeMenu }}">Quy chế tuyển sinh</a><a href="#" onClick="{{ closeMenu }}">Lịch năm học</a><a href="#" onClick="{{ closeMenu }}">Cẩm nang phụ huynh</a><a href="#" onClick="{{ closeMenu }}">Chương trình giáo dục Trí tuệ nhân tạo</a></nav></div></div></div></sc-if><section class="hero"><div class="bg"><img src="e43c5b1adc6c512576b3728092ede510.webp" alt="Ba học sinh trung học làm thí nghiệm trong phòng lab khoa học"></div><div class="fade"></div><div class="wrap"><div class="hero-copy"><h1 class="disp rise d1" style="font-size: 58px; margin: 22px 0 24px; width: 981px"><span class="gold">Trung học</span></h1><p class="just rise d2" style="margin:0 0 32px;font-size:17px;line-height:1.5;max-width:464px">Trung học là giai đoạn học sinh định hình bản sắc, phát triển tư duy chuyên sâu và xác lập định hướng tương lai. Tại Vinschool, học sinh được khuyến khích chủ động, tư duy độc lập và có trách nhiệm với lựa chọn của mình, từ đó khám phá thế mạnh, nuôi dưỡng đam mê và xây dựng mục tiêu phù hợp.</p><div class="rise d3" style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><a class="btn pill" href="#dang-ky">Đăng ký tìm hiểu Vinschool <span class="ci"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a></div></div></div></section><section class="sec kem" style="padding: 88px 0; height: 711px"><div class="wrap gfwrap"><div data-rv=""><h2 class="disp h2" style="font-size:38px;margin:-4px 0 20px">Chương trình<br>giáo dục</h2><p style="margin:0;max-width:400px;font-size:16px;line-height:1.45">Chú trọng chiều sâu học thuật thông qua thảo luận, nghiên cứu, dự án và trải nghiệm thực tiễn, giúp học sinh phát triển tư duy phản biện, giải quyết vấn đề, sáng tạo, giao tiếp, hợp tác và ứng dụng AI hiệu quả, có trách nhiệm.</p><a class="btn pill" href="#khac-biet" style="margin-top:28px">Xem chi tiết <span class="ci"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a></div><div class="gfgrid" data-rv=""><div class="gf"><strong class="gfnum"><small class="gfsup">Gần</small>50</strong><p>Môn học được thiết kế theo mô hình “Đại học” ở bậc THPT, mang đến lộ trình học tập linh hoạt và cá nhân hóa.</p></div><div class="gf"><strong class="gfnum"><small class="gfsup">Cố vấn học tập</small>1:1</strong><p>Đồng hành giúp học sinh khám phá bản thân, tìm hiểu ngành nghề, định hướng nghề nghiệp và mục tiêu ứng tuyển đại học.</p></div><div class="gf"><strong class="gfnum gfword"><small class="gfsup">Chương trình</small>Pastoral Care</strong><p>Chú trọng phát triển thể chất, sức khỏe tinh thần và các kỹ năng cần thiết để học sinh thích ứng trước những thay đổi của thế giới.</p></div><div class="gf"><strong class="gfnum gfword"><small class="gfsup">Trang bị</small>3 năng lực AI</strong><p>Hiểu AI – Ứng dụng AI – Sử dụng AI có trách nhiệm được phát triển từng bước, tích hợp trong chương trình chính khoá và thiết kế theo từng độ tuổi từ 5 - 18 tuổi.</p></div></div></div></section><section class="sec" id="khac-biet" style="padding:48px 0"><div class="wrap"><div data-rv="" style="max-width:760px"><h2 class="disp h2" style="margin-top:0">6 điểm <span class="gold">nổi bật</span></h2></div><div class="split" data-rv="" style="display:grid;grid-template-columns:500px 1fr;gap:40px;margin-top:32px;align-items:stretch"><ul class="plist" role="tablist" aria-label="6 điểm nổi bật"><sc-for list="{{ pillars }}" as="p" hint-placeholder-count="6"><li><button class="{{ p.cls }}" role="tab" aria-selected="{{ p.sel }}" onClick="{{ p.pick }}"><span class="n">{{ p.n }}</span><span class="t"><span class="{{ p.c1 }}">{{ p.t1 }}</span><br><span class="{{ p.c2 }}">{{ p.t2 }}</span></span></button></li></sc-for></ul><sc-for list="{{ curList }}" as="cur" hint-placeholder-count="1"><article class="pcard swap" role="tabpanel"><div class="ph"><img src="{{ cur.img }}" alt="{{ cur.alt }}"></div><div class="tx"><p class="just" style="margin:0;font-size:17px;line-height:1.45">{{ cur.text }}</p></div></article></sc-for></div><div class="pmob" role="list" aria-label="Điểm nổi bật"><sc-for list="{{ pillarsAll }}" as="q" hint-placeholder-count="6"><article class="pmc" role="listitem"><div class="pmi"><img src="{{ q.img }}" alt="{{ q.alt }}"></div><div class="pmt"><span class="pmn">{{ q.n }}</span><h3><span class="pmh1">{{ q.t1 }}</span><span class="pmh2">{{ q.t2 }}</span></h3><p>{{ q.text }}</p></div></article></sc-for></div></div></section><section class="sec kem" style="padding: 64px 0; height: 696px"><div class="wrap"><div data-rv="" style="text-align:center;margin:0 auto"><h2 class="disp h2 dayh" style="font-size:38px;margin-top:0">Một ngày ở trường <br class="mbr">Trung học Vinschool<br><span class="gold">diễn ra như thế nào?</span></h2></div><div class="rail" data-rv=""><span class="fill" style="width:{{ railFill }}"></span><sc-for list="{{ dayNodes }}" as="d" hint-placeholder-count="5"><button class="{{ d.cls }}" aria-pressed="{{ d.sel }}" onClick="{{ d.pick }}"><span class="dot"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ d.ic }}"></path></svg></span><span class="tm">{{ d.tm }}</span><span class="nm">{{ d.nm }}</span></button></sc-for></div><sc-for list="{{ dcurList }}" as="dcur" hint-placeholder-count="1"><div class="dc <script>(function(){
  'use strict';
  function get(scope, expr){
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    var parts = expr.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++){ if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, ONE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var BOOL = { disabled:1, hidden:1, checked:1, selected:1, readonly:1, required:1 };
  function interp(str, scope){ return str.replace(HOLE, function(_, e){ var v = get(scope, e); return v == null ? '' : String(v); }); }
  function proc(node, scope, out){

    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for'){
      var list = get(scope, ONE.exec(node.getAttribute('list'))[1]) || [], as = node.getAttribute('as');
      list.forEach(function(item){
        var s = Object.create(scope); s[as] = item;
        var frag = document.createDocumentFragment();
        node.childNodes.forEach(function(c){ proc(c, s, frag); });
        if (item && item.key !== undefined) frag.childNodes.forEach(function(c){ if (c.nodeType === 1) c.setAttribute('data-k', as + ':' + item.key); });
        out.appendChild(frag);
      });
      return;
    }
    if (tag === 'sc-if'){
      if (get(scope, ONE.exec(node.getAttribute('value'))[1])) node.childNodes.forEach(function(c){ proc(c, scope, out); });
      return;
    }
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(tag);
    for (var i = 0; i < node.attributes.length; i++){
      var a = node.attributes[i], n = a.name, v = a.value;
      if (n.indexOf('hint-') === 0) continue;
      var m = ONE.exec(v);
      if (/^on[a-z]+$/i.test(n)){ if (m){ var fn = get(scope, m[1]); if (typeof fn === 'function'){ el.__h = el.__h || {}; el.__h[n.slice(2).toLowerCase()] = fn; } } continue; }
      if (m && BOOL[n.toLowerCase()]){ if (get(scope, m[1])) el.setAttribute(n, ''); continue; }
      el.setAttribute(n, v.indexOf('{{') > -1 ? interp(v, scope) : v);
    }
    node.childNodes.forEach(function(c){ proc(c, scope, el); });
    out.appendChild(el);
  }
  function morph(a, b){
    // a: live node, b: new node (same type assumed by caller)
    if (a.nodeType === 3){ if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
    var i, n;
    for (i = a.attributes.length - 1; i >= 0; i--){ n = a.attributes[i].name; if (!b.hasAttribute(n) && n !== 'class') a.removeAttribute(n); }
    for (i = 0; i < b.attributes.length; i++){ n = b.attributes[i]; if (n.name === 'class') continue; if (a.getAttribute(n.name) !== n.value) a.setAttribute(n.name, n.value); }
    // class: keep runtime-added classes (in, js-rv) that template didn't produce
    var keep = (a.getAttribute('class') || '').split(/\s+/).filter(function(c){ return c === 'in' || c === 'js-rv'; });
    var cls = ((b.getAttribute('class') || '') + ' ' + keep.join(' ')).trim();
    if ((a.getAttribute('class') || '') !== cls){ if (cls) a.setAttribute('class', cls); else a.removeAttribute('class'); }
    a.__h = b.__h;
    var ac = a.childNodes, bc = Array.prototype.slice.call(b.childNodes);
    for (i = 0; i < bc.length; i++){
      var x = ac[i], y = bc[i];
      if (!x){ a.appendChild(y); continue; }
      if (x.nodeType !== y.nodeType || (x.nodeType === 1 && (x.nodeName !== y.nodeName || x.getAttribute('data-k') !== y.getAttribute('data-k')))){ a.replaceChild(y, x); continue; }
      morph(x, y);
    }
    while (ac.length > bc.length) a.removeChild(a.lastChild);
  }

  function build(){ var f = document.createDocumentFragment(); var vals = inst.renderVals(); tpl.content.childNodes.forEach(function(c){ proc(c, vals, f); }); return f; }
  function render(first){
    var f = build();

    var wrap = document.createElement('div'); wrap.appendChild(f);
    morph(root, wrap);
  }
  window.DCLogic = function DCLogic(props){ this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function(p){ Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); render(false); };
